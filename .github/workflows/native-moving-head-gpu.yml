name: Native JVM render shaders
on:
  pull_request:
    paths: ['src/afterglow/render/**', 'resources/gpu/mover-aim.vert', 'test-native/**', 'project.clj', '.github/workflows/native-moving-head-gpu.yml', '.github/scripts/choose-mac-runner']
  push:
    branches: [master]
    paths: ['src/afterglow/render/**', 'resources/gpu/mover-aim.vert', 'test-native/**', 'project.clj', '.github/workflows/native-moving-head-gpu.yml', '.github/scripts/choose-mac-runner']
permissions:
  contents: read
  statuses: read
jobs:
  choose-mac:
    if: >-
      vars.LOCAL_MAC_NATIVE_GPU == 'enabled' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 47
    outputs:
      runner: ${{ steps.select.outputs.runner || steps.claim.outputs.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Await Apple Silicon ${{ github.sha }}
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/choose-mac-runner offer
      - name: Accepted Apple Silicon ${{ github.sha }}
        if: steps.claim.outputs.runner == 'claimed'
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/choose-mac-runner result
      - name: Report a failing Mac native suite
        if: steps.select.outputs.runner == 'local-failure' || steps.claim.outputs.runner == 'local-failure'
        run: exit 1
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - run: .github/scripts/install-lein
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository
          key: afterglow-lein-${{ runner.os }}-${{ hashFiles('project.clj') }}
          restore-keys: afterglow-lein-${{ runner.os }}-
      - name: Exercise Mesa on an isolated Linux display
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a lein with-profile +native-gpu test afterglow.render.native-gpu-test afterglow.render.gpu-expressions-test afterglow.render.gpu-session-test afterglow.render.native-compute-test afterglow.render.native-chain-test
  hosted-mac:
    needs: choose-mac
    if: >-
      !cancelled() &&
      needs.choose-mac.outputs.runner != 'local' &&
      needs.choose-mac.outputs.runner != 'local-failure'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - run: .github/scripts/install-lein
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository
          key: afterglow-lein-${{ runner.os }}-${{ hashFiles('project.clj') }}
          restore-keys: afterglow-lein-${{ runner.os }}-
      - name: Exercise macOS offscreen OpenGL
        run: lein with-profile +native-gpu test afterglow.render.native-gpu-test afterglow.render.gpu-expressions-test afterglow.render.gpu-session-test afterglow.render.native-compute-test afterglow.render.native-chain-test
