name: Architecture regression tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21', '25']
        suite: [pure, parity]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          lein: 2.13.1
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository
          key: afterglow-lein-${{ runner.os }}-${{ hashFiles('project.clj') }}
      - name: Run focused tests
        if: matrix.suite == 'pure'
        run: lein test-pure
      - name: Run all tests
        if: matrix.suite == 'parity'
        run: lein test
