name: Verify Leiningen distribution
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'project.clj'
      - '.github/scripts/install-lein'
      - 'package*.json'
      - 'src/afterglow/render/**'
      - 'resources/gpu/**'
      - '.github/workflows/project-package.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Leiningen
        run: .github/scripts/install-lein
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - name: Install documentation dependencies
        run: npm ci
      - name: Build and inspect the distribution
        run: |
          lein uberjar
          jar tf target/afterglow.jar > "$RUNNER_TEMP/afterglow-jar-entries"
          grep -Fx 'developer_guide/index.html' "$RUNNER_TEMP/afterglow-jar-entries"
          grep -Fx 'api_doc/index.html' "$RUNNER_TEMP/afterglow-jar-entries"
          grep -Fx 'afterglow/version.edn' "$RUNNER_TEMP/afterglow-jar-entries"
          java -jar target/afterglow.jar --help
      - name: Load the packaged shaders outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          java -Djava.awt.headless=true -cp "$GITHUB_WORKSPACE/target/afterglow.jar" clojure.main -e '
            (require (quote [afterglow.render.gpu :as gpu])
                     (quote [clojure.java.io :as io])
                     (quote [clojure.string :as str]))
            (doseq [asset [:moving-head-vertex :moving-head-solver :expression-runner]]
              (let [url (io/resource (gpu/resources asset))]
                (assert (= "jar" (some-> url .getProtocol)) (str "Missing packaged asset " asset))
                (assert (seq (str/trim (gpu/source asset))) (str "Empty shader source for " asset))))'
